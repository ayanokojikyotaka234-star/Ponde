<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ponde</title>
<style>
  :root{
    --bg-top:#bfe3ff;
    --bg-bottom:#bdeecb;
    --dock-bg:rgba(20,22,30,0.55);
    --dock-border:rgba(255,255,255,0.14);
    --ink:#101018;
    --paper:#f4f7f5;
    --accent:#ff5d73;
    --accent-2:#4fd1a5;
    --accent-3:#ffd166;
    --shadow:rgba(10,12,20,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg-bottom);
    touch-action:none;
    overscroll-behavior:none;
  }
  #scene-container{
    position:fixed; inset:0;
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 78%);
  }
  canvas{display:block; touch-action:none;}

  /* Top status pill */
  #status-pill{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%);
    background:rgba(16,16,24,0.55);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    color:#fff; padding:9px 20px; border-radius:999px;
    font-size:14px; font-weight:600; letter-spacing:0.2px;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 6px 20px var(--shadow);
    border:1px solid rgba(255,255,255,0.12);
    z-index:40; transition:transform .18s ease;
  }
  #status-dot{
    width:8px; height:8px; border-radius:50%; background:var(--accent-2);
    box-shadow:0 0 8px var(--accent-2);
    transition:background .2s ease, box-shadow .2s ease;
  }
  #status-pill.bump{transform:translateX(-50%) scale(1.06);}

  /* Upload button */
  #upload-btn{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); right:16px;
    width:50px; height:50px; border-radius:50%;
    background:rgba(16,16,24,0.55);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,0.14);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px var(--shadow);
    z-index:40; cursor:pointer;
  }
  #upload-btn:active{transform:scale(0.92);}
  #upload-btn svg{width:24px; height:24px;}

  #file-input{display:none;}

  /* Toast */
  #toast{
    position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:rgba(16,16,24,0.85); color:#fff;
    padding:11px 18px; border-radius:14px; font-size:13.5px; font-weight:500;
    opacity:0; pointer-events:none; z-index:60;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 8px 24px var(--shadow);
    max-width:78vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Floating reaction icon over the character */
  #reaction-pop{
    position:fixed; z-index:35; pointer-events:none;
    width:56px; height:56px; opacity:0;
    left:50%; top:38%;
    transform:translate(-50%,-50%) scale(0.4);
  }
  #reaction-pop.pop{animation:popUp .85s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes popUp{
    0%{opacity:0; transform:translate(-50%,-30%) scale(0.3);}
    18%{opacity:1; transform:translate(-50%,-70%) scale(1.15);}
    30%{transform:translate(-50%,-65%) scale(1);}
    75%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-110%) scale(0.85);}
  }

  /* Bottom dock */
  #dock{
    position:fixed; left:0; right:0; bottom:0;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
    z-index:50;
  }
  #dock-inner{
    display:flex; align-items:center; gap:8px;
    background:var(--dock-bg);
    backdrop-filter:blur(20px) saturate(170%);
    -webkit-backdrop-filter:blur(20px) saturate(170%);
    border:1px solid var(--dock-border);
    border-radius:30px;
    padding:8px;
    box-shadow:0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
    max-width:100vw;
  }
  .dock-btn{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.10);
    cursor:pointer; flex-shrink:0;
    transition:background .15s ease, transform .1s ease;
  }
  .dock-btn svg{width:23px; height:23px;}
  .dock-btn:active{transform:scale(0.88); background:rgba(255,255,255,0.18);}

  #mic-btn{
    width:56px; height:56px;
    background:radial-gradient(circle at 35% 30%, #ff8a9a, var(--accent) 70%);
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 4px 14px rgba(255,93,115,0.5);
  }
  #mic-btn svg{width:26px; height:26px;}
  #mic-btn.recording{animation:pulseRec 1s ease-in-out infinite;}
  @keyframes pulseRec{
    0%{box-shadow:0 0 0 0 rgba(255,93,115,0.65);}
    70%{box-shadow:0 0 0 16px rgba(255,93,115,0);}
    100%{box-shadow:0 0 0 0 rgba(255,93,115,0);}
  }

  #loading-screen{
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .5s ease;
  }
  #loading-screen .lname{
    font-size:32px; font-weight:800; color:var(--ink); letter-spacing:-0.5px;
    margin-bottom:14px;
  }
  #loading-bar-track{
    width:160px; height:6px; border-radius:4px; background:rgba(16,16,24,0.15);
    overflow:hidden;
  }
  #loading-bar{
    width:0%; height:100%; background:var(--ink); border-radius:4px;
    transition:width .3s ease;
  }
  #loading-screen.hide{opacity:0; pointer-events:none;}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================================================
   PONDE — a Talking-Tom style 3D virtual pet
   Single-file implementation: Three.js scene + Web Audio SFX
   ============================================================ */

/* ---------- Small DOM helpers ---------- */
const $ = (id) => document.getElementById(id);
const statusText = $('status-text');
const statusPill = $('status-pill');
const statusDot = $('status-dot');
const toastEl = $('toast');
const reactionPop = $('reaction-pop');

let toastTimer = null;
function showToast(msg, ms = 1800){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), ms);
}

function setMood(text, dotColor){
  statusText.textContent = text;
  if (dotColor) statusDot.style.background = dotColor;
  statusDot.style.boxShadow = `0 0 8px ${dotColor || '#4fd1a5'}`;
  statusPill.classList.add('bump');
  setTimeout(()=> statusPill.classList.remove('bump'), 180);
}

/* Reaction icon pop-up — builds small inline SVGs as data URIs */
function svgToDataUri(svgInner, stroke){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">${svgInner}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
const REACTION_ICONS = {
  pain: svgToDataUri(`<circle cx="12" cy="12" r="11" fill="#ff3b4e"/><rect x="10.7" y="5.5" width="2.6" height="9" rx="1.3" fill="white"/><circle cx="12" cy="17.3" r="1.5" fill="white"/>`),
  heal: svgToDataUri(`<circle cx="12" cy="12" r="11" fill="#4fd1a5"/><path d="M12 6.5C12 6.5 7 9.8 7 13.4C7 15.9 9.2 17.7 12 17.7C14.8 17.7 17 15.9 17 13.4C17 9.8 12 6.5 12 6.5Z" fill="white"/>`),
  fart: svgToDataUri(`<circle cx="12" cy="12" r="11" fill="#8fd18f"/><path d="M6 15C6 12 9 12 9 9C9 7 7.5 6.5 8 5" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M10 16C10.6 13.6 13 13.5 13 11C13 9 15 8.5 15.5 6.5" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="17" cy="15" r="2" fill="white"/>`)
};
function popReaction(kind){
  reactionPop.src = REACTION_ICONS[kind];
  reactionPop.classList.remove('pop');
  void reactionPop.offsetWidth; // restart animation
  reactionPop.classList.add('pop');
}

/* ---------- Web Audio SFX (fully synthesized, no external files) ---------- */
let audioCtx = null;
function getCtx(){
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playOuch(){
  const ctx = getCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(680, now);
  osc.frequency.exponentialRampToValueAtTime(220, now + 0.18);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.24);
}

function playLaugh(){
  const ctx = getCtx();
  const now = ctx.currentTime;
  for (let i=0;i<5;i++){
    const t = now + i*0.13;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(320 + (i%2)*60, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.12);
  }
}

function playFart(){
  const ctx = getCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(90, now);
  osc.frequency.linearRampToValueAtTime(45, now + 0.5);
  osc.frequency.linearRampToValueAtTime(70, now + 0.75);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.3, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
  const lfo = ctx.createOscillator();
  lfo.frequency.setValueAtTime(28, now);
  const lfoGain = ctx.createGain();
  lfoGain.gain.setValueAtTime(18, now);
  lfo.connect(lfoGain).connect(osc.frequency);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); lfo.start(now);
  osc.stop(now + 0.82); lfo.stop(now + 0.82);
}

function playChew(){
  const ctx = getCtx();
  const now = ctx.currentTime;
  for (let i=0;i<3;i++){
    const t = now + i*0.22;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(90, t + 0.15);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.18);
  }
}

function playSnore(){
  const ctx = getCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(140, now);
  osc.frequency.linearRampToValueAtTime(90, now + 0.6);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.22, now + 0.15);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.72);
}

function playPoke(){
  const ctx = getCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(500, now);
  osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.12);
}

/* ================= THREE.JS SCENE ================= */
const container = $('scene-container');
let scene, camera, renderer;
let clock = new THREE.Clock();

let ponde; // group holding whole character
let head, headMesh, leftArm, rightArm, torso, leftLeg, rightLeg, mouthMesh, eyeL, eyeR;
let baseY = 0;
let idleTime = 0;

let currentAction = null; // 'poke' | 'fart' | 'food' | 'laugh' | 'sleep' | null
let actionStart = 0;
let isSleeping = false;
let isFlinching = false;
let flinchStart = 0;

function initScene(){
  scene = new THREE.Scene();

  const w = window.innerWidth, h = window.innerHeight;
  camera = new THREE.PerspectiveCamera(38, w/h, 0.1, 100);
  camera.position.set(0, 1.55, 6.4);
  camera.lookAt(0, 1.15, 0);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambient = new THREE.AmbientLight(0xfff2e0, 0.65);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.05);
  dirLight.position.set(3.2, 5.5, 4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.left = -3;
  dirLight.shadow.camera.right = 3;
  dirLight.shadow.camera.top = 3;
  dirLight.shadow.camera.bottom = -3;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xaad4ff, 0.35);
  fillLight.position.set(-3, 2, -2);
  scene.add(fillLight);

  // Floor
  const floorGeo = new THREE.CircleGeometry(3.4, 48);
  const floorMat = new THREE.MeshStandardMaterial({ color:0xc9a06a, roughness:0.9, metalness:0.02 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);

  // subtle rug ring
  const ringGeo = new THREE.RingGeometry(1.35, 1.55, 48);
  const ringMat = new THREE.MeshStandardMaterial({ color:0xdb6b5b, roughness:0.95, side:THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.005;
  scene.add(ring);

  buildCharacter();

  window.addEventListener('resize', onResize);
}

/* ---------- Build Ponde the character ---------- */
const SKIN = 0xd2a679;
const OUTFIT = 0x1a1a2e;
const PANTS = 0x14141f;

function buildCharacter(){
  ponde = new THREE.Group();
  ponde.position.y = 0;
  scene.add(ponde);

  const skinMat = new THREE.MeshStandardMaterial({ color: SKIN, roughness:0.55, metalness:0.02 });
  const outfitMat = new THREE.MeshStandardMaterial({ color: OUTFIT, roughness:0.6, metalness:0.05 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: PANTS, roughness:0.65 });

  // Legs
  const legGeo = new THREE.CapsuleGeometry(0.16, 0.62, 6, 10);
  leftLeg = new THREE.Mesh(legGeo, pantsMat);
  leftLeg.position.set(-0.18, 0.5, 0);
  leftLeg.castShadow = true;
  ponde.add(leftLeg);

  rightLeg = new THREE.Mesh(legGeo, pantsMat);
  rightLeg.position.set(0.18, 0.5, 0);
  rightLeg.castShadow = true;
  ponde.add(rightLeg);

  // Torso (kurta) — tapered using a cylinder
  const torsoGeo = new THREE.CylinderGeometry(0.42, 0.34, 1.0, 16);
  torso = new THREE.Mesh(torsoGeo, outfitMat);
  torso.position.set(0, 1.32, 0);
  torso.castShadow = true;
  ponde.add(torso);

  // Kurta collar detail
  const collarGeo = new THREE.TorusGeometry(0.14, 0.03, 8, 16);
  const collar = new THREE.Mesh(collarGeo, new THREE.MeshStandardMaterial({ color:0xf2c14e, roughness:0.4, metalness:0.3 }));
  collar.position.set(0, 1.78, 0.05);
  collar.rotation.x = Math.PI/2.3;
  ponde.add(collar);

  // Arms group (pivot at shoulder)
  const armGeo = new THREE.CapsuleGeometry(0.11, 0.62, 6, 10);

  leftArm = new THREE.Group();
  leftArm.position.set(-0.5, 1.68, 0);
  const leftArmMesh = new THREE.Mesh(armGeo, outfitMat);
  leftArmMesh.position.set(0, -0.34, 0);
  leftArmMesh.castShadow = true;
  leftArm.add(leftArmMesh);
  const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), skinMat);
  leftHand.position.set(0, -0.66, 0);
  leftHand.castShadow = true;
  leftArm.add(leftHand);
  ponde.add(leftArm);

  rightArm = new THREE.Group();
  rightArm.position.set(0.5, 1.68, 0);
  const rightArmMesh = new THREE.Mesh(armGeo, outfitMat);
  rightArmMesh.position.set(0, -0.34, 0);
  rightArmMesh.castShadow = true;
  rightArm.add(rightArmMesh);
  const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), skinMat);
  rightHand.position.set(0, -0.66, 0);
  rightHand.castShadow = true;
  rightArm.add(rightHand);
  ponde.add(rightArm);

  // Neck
  const neckGeo = new THREE.CylinderGeometry(0.1, 0.11, 0.14, 12);
  const neck = new THREE.Mesh(neckGeo, skinMat);
  neck.position.set(0, 1.86, 0);
  ponde.add(neck);

  // Head group (so we can texture / animate independently)
  head = new THREE.Group();
  head.position.set(0, 2.18, 0);
  ponde.add(head);

  const headGeo = new THREE.SphereGeometry(0.34, 32, 32);
  headMesh = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({ color: SKIN, roughness:0.5 }));
  headMesh.castShadow = true;
  head.add(headMesh);

  // Simple hair cap
  const hairGeo = new THREE.SphereGeometry(0.35, 24, 24, 0, Math.PI*2, 0, Math.PI*0.52);
  const hairMat = new THREE.MeshStandardMaterial({ color:0x24211d, roughness:0.7 });
  const hair = new THREE.Mesh(hairGeo, hairMat);
  hair.position.y = 0.03;
  head.add(hair);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.045, 12, 12);
  const eyeMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.3 });
  eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.12, 0.02, 0.30);
  head.add(eyeL);
  eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.12, 0.02, 0.30);
  head.add(eyeR);

  // Mouth
  const mouthGeo = new THREE.BoxGeometry(0.14, 0.035, 0.02);
  const mouthMat = new THREE.MeshStandardMaterial({ color:0x7a3b3b, roughness:0.6 });
  mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
  mouthMesh.position.set(0, -0.14, 0.30);
  head.add(mouthMesh);

  baseY = ponde.position.y;
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

/* ---------- Photo upload → head texture ---------- */
const fileInput = $('file-input');
$('upload-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const loader = new THREE.TextureLoader();
    loader.load(ev.target.result, (tex) => {
      tex.encoding = THREE.sRGBEncoding !== undefined ? THREE.sRGBEncoding : tex.encoding;
      headMesh.material.map = tex;
      headMesh.material.color.set(0xffffff);
      headMesh.material.needsUpdate = true;
      // hide the drawn eyes/mouth/hair since a real face photo is now shown
      eyeL.visible = false;
      eyeR.visible = false;
      mouthMesh.visible = false;
      showToast('Photo mapped successfully!');
    });
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

/* ---------- Interactions: tap to hurt, drag to heal ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let isDraggingOnBody = false;
let healAccum = 0;

function getPointerNDC(clientX, clientY){
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
}

function hitTestCharacter(){
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObject(ponde, true);
  return intersects.length > 0;
}

function triggerFlinch(){
  isFlinching = true;
  flinchStart = clock.getElapsedTime();
  popReaction('pain');
  playOuch();
  setMood('Ouch!', '#ff5d73');
}

function triggerHeal(){
  popReaction('heal');
  setMood('Relieved', '#4fd1a5');
}

function onPointerDown(clientX, clientY){
  getCtx(); // unlock audio on first gesture
  getPointerNDC(clientX, clientY);
  if (hitTestCharacter()){
    isDraggingOnBody = true;
    healAccum = 0;
    triggerFlinch();
  }
}
function onPointerMove(clientX, clientY){
  if (!isDraggingOnBody) return;
  getPointerNDC(clientX, clientY);
  if (hitTestCharacter()){
    healAccum += 1;
    if (healAccum === 6){ triggerHeal(); }
  }
}
function onPointerUp(){
  isDraggingOnBody = false;
  healAccum = 0;
}

const canvasEl = () => renderer.domElement;

function attachPointerEvents(){
  const el = renderer.domElement;
  el.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    const t = e.touches[0];
    onPointerDown(t.clientX, t.clientY);
  }, { passive:false });
  el.addEventListener('touchmove', (e)=>{
    e.preventDefault();
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive:false });
  el.addEventListener('touchend', (e)=>{
    e.preventDefault();
    onPointerUp();
  }, { passive:false });

  el.addEventListener('mousedown', (e)=> onPointerDown(e.clientX, e.clientY));
  el.addEventListener('mousemove', (e)=> onPointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onPointerUp);
}

/* ---------- Button actions ---------- */
function startAction(name){
  currentAction = name;
  actionStart = clock.getElapsedTime();
}

$('btn-poke').addEventListener('click', ()=>{
  getCtx();
  startAction('poke');
  playPoke();
  setMood('Poked!', '#ffd166');
});

$('btn-cake').addEventListener('click', ()=>{
  getCtx();
  startAction('cake');
  setMood('Yum!', '#ffd166');
});

$('btn-fart').addEventListener('click', ()=>{
  getCtx();
  startAction('fart');
  playFart();
  popReaction('fart');
  setMood('Oops...', '#8fd18f');
});

$('btn-food').addEventListener('click', ()=>{
  getCtx();
  startAction('food');
  playChew();
  setMood('Eating', '#ffd166');
});

$('btn-laugh').addEventListener('click', ()=>{

    isSleeping = false;

  } else {
    isSleeping = true;
    playSnore();
    setMood('Sleeping', '#8fa8d1');
  }
});

/* ---------- Voice recorder (hold mic to record, release to play back sped up) ---------- */
const micBtn = $('mic-btn');
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let isPlayingBack = false;

async function startRecording(){
  if (isRecording) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e)=>{ if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    setMood('Listening...', '#ff5d73');
  } catch(err){
    showToast('Microphone access needed for recording');
  }
}

function stopRecording(){
  if (!isRecording || !mediaRecorder) return;
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t=>t.stop());
  isRecording = false;
  micBtn.classList.remove('recording');
}

function onRecordingStop(){
  if (recordedChunks.length === 0) return;
  const blob = new Blob(recordedChunks, { type:'audio/webm' });
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.playbackRate = 1.5;
  isPlayingBack = true;
  setMood('...', '#ffd166');
  audio.addEventListener('ended', ()=>{
    isPlayingBack = false;
    setMood('Happy', '#4fd1a5');
    URL.revokeObjectURL(url);
  });
  audio.play().catch(()=>{ isPlayingBack = false; });
}

micBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); getCtx(); startRecording(); }, { passive:false });
micBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); stopRecording(); }, { passive:false });
micBtn.addEventListener('mousedown', ()=>{ getCtx(); startRecording(); });
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('mouseleave', ()=>{ if (isRecording) stopRecording(); });

/* ---------- Animation loop ---------- */
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // Idle breathing (skip while sleeping — replaced by slow breathing lie-down)
  if (!isSleeping){
    ponde.position.y = baseY + Math.sin(t * 1.8) * 0.02;
  }

  // Mouth animation while playing back recorded voice
  if (isPlayingBack && mouthMesh.visible){
    mouthMesh.scale.y = 1 + Math.abs(Math.sin(t * 18)) * 4;
  } else if (mouthMesh.visible && !currentAction){
    mouthMesh.scale.y += (1 - mouthMesh.scale.y) * 0.2;
  }

  // Flinch (pain) animation
  if (isFlinching){
    const et = t - flinchStart;
    if (et < 0.35){
      ponde.rotation.z = Math.sin(et * 40) * 0.06 * (1 - et/0.35);
      ponde.position.x = Math.sin(et * 50) * 0.03;
    } else {
      isFlinching = false;
      ponde.rotation.z = 0;
      ponde.position.x = 0;
    }
  }

  // Sleep pose (lie down)
  const targetSleepRot = isSleeping ? Math.PI/2 : 0;
  ponde.rotation.x += (targetSleepRot - ponde.rotation.x) * 0.08;
  if (isSleeping){
    ponde.position.z += (0.9 - ponde.position.z) * 0.08;
    ponde.position.y += (0.35 - ponde.position.y) * 0.08;
    eyeL.scale.y += (0.1 - eyeL.scale.y) * 0.15;
    eyeR.scale.y += (0.1 - eyeR.scale.y) * 0.15;
    // gentle snore breathing bob
    ponde.position.y += Math.sin(t * 2.2) * 0.008;
  } else {
    ponde.position.z += (0 - ponde.position.z) * 0.08;
    eyeL.scale.y += (1 - eyeL.scale.y) * 0.15;
    eyeR.scale.y += (1 - eyeR.scale.y) * 0.15;
  }

  // Button-triggered actions
  if (currentAction){
    const et = t - actionStart;
    switch(currentAction){
      case 'poke': {
        const dur = 0.5;
        if (et < dur){
          ponde.rotation.y = Math.sin(et * 30) * 0.18 * (1 - et/dur);
        } else {
          ponde.rotation.y = 0;
          currentAction = null;
        }
        break;
      }
      case 'cake': {
        const dur = 0.6;
        if (et < dur){
          const flash = 1 - Math.abs((et/dur) - 0.5) * 2;
          headMesh.material.emissive = headMesh.material.emissive || new THREE.Color(0x000000);
          headMesh.material.emissive.setRGB(flash*0.9, flash*0.9, flash*0.9);
        } else {
          headMesh.material.emissive && headMesh.material.emissive.setRGB(0,0,0);
          currentAction = null;
        }
        break;
      }
      case 'fart': {
        const dur = 0.8;
        if (et < dur){
          ponde.position.x = -Math.sin(et/dur * Math.PI) * 0.35;
        } else {
          ponde.position.x = 0;
          currentAction = null;
        }
        break;
      }
      case 'food': {
        const dur = 0.9;
        if (et < dur){
          const swing = Math.sin(et/dur * Math.PI);
          leftArm.rotation.x = -swing * 2.1;
          if (mouthMesh.visible) mouthMesh.scale.y = 1 + Math.abs(Math.sin(et*20)) * 3;
        } else {
          leftArm.rotation.x = 0;
          currentAction = null;
        }
        break;
      }
      case 'laugh': {
        const dur = 0.9;
        if (et < dur){
          const s = 1 + Math.abs(Math.sin(et * 14)) * 0.09;
          ponde.scale.set(s, s, s);
        } else {
          ponde.scale.set(1,1,1);
          currentAction = null;
        }
        break;
      }
    }
  } else if (!isFlinching){
    ponde.rotation.y += (0 - ponde.rotation.y) * 0.15;
  }

  renderer.render(scene, camera);
}

/* ---------- Boot ---------- */
function boot(){
  initScene();
  attachPointerEvents();

  const bar = $('loading-bar');
  let pct = 0;
  const iv = setInterval(()=>{
    pct += 18 + Math.random()*20;
    if (pct >= 100){
      pct = 100;
      clearInterval(iv);
      bar.style.width = '100%';
      setTimeout(()=>{
        $('loading-screen').classList.add('hide');
      }, 220);
    } else {
      bar.style.width = pct + '%';
    }
  }, 90);

  animate();
}

boot();

})();
